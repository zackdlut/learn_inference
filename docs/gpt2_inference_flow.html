<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPT-2 · 逐步推理与张量形状（矩阵示意）</title>
<style>
  :root {
    --paper: #fbfaf6; --ink: #222; --muted: #6b6b6b; --line: #e4e1d8;
    --hand: "Comic Sans MS", "Segoe Print", "Kalam", "Xiaolai SC", cursive;

  .note { font-size: 13.5px; line-height: 1.7; color: #333; margin: 4px 0 0; }

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<main>
  <h1>GPT-2：从文本到下一 token 预测</h1>
  <p class="sub">
    对应本仓库 <a href="../data/gpt2/"><code>data/gpt2/</code></a>（GPT-2 small）。
    为便于画图，固定 <code>B = 1</code>（单条序列）、<code>T = 4</code>（4 个 token）、隐藏维 <code>d = 768</code>、头数 <code>H = 12</code>、每头 <code>d<sub>h</sub> = 64</code>、词表 <code>V = 50257</code>；完整模型堆叠 <code>12</code> 个相同结构的块。
    方块大小按 √维度 缩放。<span class="red">红色维度</span> 为矩阵乘中被求和消掉的内维。
    相关文件说明见 <a href="huggingface_model_files.html">huggingface_model_files.html</a>；
    这些运算如何组织成本项目的计算图见 <a href="gpt2_compute_graph.html">gpt2_compute_graph.html</a>。
  </p>
  <div class="legend" id="legend"></div>
  <div id="content"></div>
</main>

<script>
const KIND = {
  data:  { name: "输入 / id",    stroke: "#2f6fd6", fill: "#e3edfc" },
  param: { name: "权重 W / b",   stroke: "#d98a00", fill: "#fdf0d6" },
  act:   { name: "中间激活",     stroke: "#239a6a", fill: "#dff4ea" },
  attn:  { name: "注意力相关",   stroke: "#7c4ddb", fill: "#ece4fb" },
  mask:  { name: "掩码",         stroke: "#777",    fill: "#ececec" },
  out:   { name: "logits / 预测", stroke: "#0f8b9c", fill: "#dcf3f6" },
  cache: { name: "KV cache",     stroke: "#b5527a", fill: "#fbe6ef" },
};
const HL = "#d23c3c";

const M = (r, c, name, kind, opt = {}) => ({ k: "m", r, c, name, kind, ...opt });
const V = (n, name, kind, opt = {}) => M(1, n, name, kind, opt);
const O = (s) => ({ k: "o", s });
const A = (s) => ({ k: "a", s });

const SECTIONS = [
  { title: "一、分词：文本 → token id", steps: [
    { title: "① BPE 编码（vocab.json + merges.txt）",
      items: [M(1, 12, "文本", "data", { rl: "1" }), A("BPE 分词器"), M(1, 4, "input_ids", "data")],
      code: 'ids = tokenizer("The cat sat.", return_tensors="pt")["input_ids"]\n# 示意: [[ 464, 3797, 3332, 13 ]]  → shape (1, T), T=4',
      note: "每个整数是词表下标，范围 0 … 50256。id 50256 是 <|endoftext|>。模型只吃 id，不直接吃 Unicode 字符串。" },
    { title: "② 位置下标 position_ids",
      items: [M(1, 4, "input_ids", "data"), A("arange(T)"), M(1, 4, "position_ids", "data")],
      code: "position_ids = torch.arange(T).unsqueeze(0)   # [[0, 1, 2, 3]]",
      note: "第 t 个 token 用第 t 个位置向量；最大长度由 config 的 n_ctx=1024 限制。" },
  ]},
  { title: "二、嵌入层：id → 初始 hidden", steps: [
    { title: "③ 词嵌入查表 wte（等价于 one-hot @ W）",
      items: [M(1, 4, "input_ids", "data"), A("index wte"), M(4, 768, "tok_emb", "act", { rl: "T" })],
      code: "tok_emb = wte(input_ids)          # wte.weight: (50257, 768)\n# 实现上: tok_emb[b,t,:] = wte.weight[input_ids[b,t]]",
      note: "逻辑上是 (1,4) 的 one-hot（每行 50257 维里只有一个 1）左乘 (50257,768)，得到 (4,768)。下图把 batch 维 1 省略，行维就是序列长度 T。" },
    { title: "④ 位置嵌入 wpe + 相加",
      items: [M(4, 768, "tok_emb", "act"), O("+"), M(4, 768, "pos_emb", "act"), O("="), M(4, 768, "x⁽⁰⁾", "act")],
      code: "pos_emb = wpe(position_ids)     # wpe.weight: (1024, 768)\nx = tok_emb + pos_emb             # (1, T, 768) 或 (T, 768)",
      note: "x⁽⁰⁾ 是进入第 1 个 Transformer 块之前的张量；之后每块输出 x⁽ℓ⁾，共 12 层。" },
  ]},
  { title: "三、单个 Transformer 块（第 ℓ 层，重复 12 次）", steps: [
    { title: "⑤ LayerNorm-1（逐 token，形状不变）",
      items: [M(4, 768, "x⁽ℓ⁻¹⁾", "act"), A("LayerNorm"), M(4, 768, "x̂", "act")],
      code: "x_hat = layer_norm_1(x)   # 用 h.{ℓ}.ln_1.weight / bias",
      note: "对每一行（每个 token 的 768 维向量）单独做均值方差归一化，再缩放平移。不混合不同 token。" },
    { title: "⑥ 合并线性层 c_attn：一次算出 Q、K、V",
      items: [M(4, 768, "x̂", "act", { hc: 768 }), O("@"), M(768, 2304, "W_attn", "param", { hr: 768 }), O("+"), V(2304, "b_attn", "param"), O("="), M(4, 2304, "qkv", "attn")],
      code: "qkv = x_hat @ W_attn + b_attn    # W_attn: (768, 2304), 2304 = 3*d",
      note: "内维 768 被消掉：qkv[t, :] 是位置 t 上 Q∥K∥V 拼接。权重来自 safetensors 的 h.{ℓ}.attn.c_attn.weight。" },
    { title: "⑦ 拆成 Q、K、V 并分头",
      items: [M(4, 2304, "qkv", "attn"), A("reshape → 3×(T,H,dh)"), M(12, 256, "Q (示意)", "attn", { rl: "H·T", cl: "T·dh" })],
      code: "Q, K, V = split(qkv, 3, dim=-1)   # 各 (T, 768)\nQ = Q.view(T, H, dh).transpose(0,1)  # (H, T, dh)",
      note: "12 个头并行：每个头只看 64 维子空间。图中用 (12, 256) 表示 H=12 个头、每头 T×dh=4×64=256 个元素排成矩阵，便于和下一步 (T,T) 注意力对齐。" },
    { title: "⑧ 注意力分数：Q Kᵀ / √d_h（每个头一张 T×T）",
      items: [M(4, 64, "Q_h", "attn", { hc: 64 }), O("@"), M(64, 4, "K_hᵀ", "attn", { hr: 64 }), O("="), M(4, 4, "scores_h", "attn")],
      code: "scores = Q @ K.transpose(-2,-1) / sqrt(dh)   # (H, T, T)",
      note: "对固定头 h，scores[t, s] 表示「位置 t 的 query 对位置 s 的 key 有多匹配」。内维 d_h=64 求和。GPT-2 是因果模型：后面还会 mask 掉 s>t。" },
    { title: "⑨ 因果掩码 + softmax（按最后一维）",
      items: [M(4, 4, "scores_h", "attn"), O("+"), M(4, 4, "causal_mask", "mask"), A("softmax 行"), M(4, 4, "A_h", "attn")],
      code: "mask = (1 - triu(ones(T,T))) * -1e10   # 上三角未来位\nweights = softmax(scores + mask, dim=-1)",
      note: "位置 t 只能看见 s ≤ t。softmax 后每行和为 1，A_h[t,s] 是「t 从 s 取值」的权重。h.{ℓ}.attn.bias 里还存有 broadcast 用的大 mask 缓冲。" },
    { title: "⑩ 加权求和 V → 拼头 → c_proj",
      items: [M(4, 4, "A_h", "attn", { hc: 4 }), O("@"), M(4, 64, "V_h", "attn", { hr: 4 }), O("="), M(4, 64, "head_out", "attn"), A("拼头+线性"), M(4, 768, "attn_out", "act")],
      code: "ctx = A @ V                        # (H, T, dh)\nattn_out = merge_heads(ctx) @ W_proj + b_proj",
      note: "内维 T=4 在 A @ V 时被消掉：每个位置得到 dh 维混合向量。12 头拼回 768，再经 c_proj (768→768)。" },
    { title: "⑪ 残差连接（注意力子层）",
      items: [M(4, 768, "x⁽ℓ⁻¹⁾", "act"), O("+"), M(4, 768, "attn_out", "act"), O("="), M(4, 768, "u", "act")],
      code: "u = x + attn_out    # 代码里 dropout 可忽略",
      note: "残差让梯度更容易训练；形状始终保持 (T, d)。" },
    { title: "⑫ LayerNorm-2 + MLP 升维（GELU）",
      items: [M(4, 768, "u", "act", { hc: 768 }), A("LN2"), O("@"), M(768, 3072, "W_fc", "param", { hr: 768 }), A("GELU"), M(4, 3072, "m", "act")],
      code: "m = gelu(layer_norm_2(u) @ W_fc + b_fc)   # 3072 = 4*768",
      note: "FFN 先把 768 扩到 4 倍，激活用 config 里的 gelu_new。对应 h.{ℓ}.mlp.c_fc.*。" },
    { title: "⑬ MLP 降维 + 残差 → 块输出 x⁽ℓ⁾",
      items: [M(4, 3072, "m", "act", { hc: 3072 }), O("@"), M(3072, 768, "W_proj", "param", { hr: 3072 }), O("+"), M(4, 768, "u", "act"), O("="), M(4, 768, "x⁽ℓ⁾", "act")],
      code: "x = u + m @ W_proj + b_proj\n# ℓ = 0..11 重复整块，得到 x⁽¹²⁾",
      note: "内维 3072 被消掉，回到 (T,768)。12 层后得到最终隐状态 h = x⁽¹²⁾。" },
  ]},
  { title: "四、语言模型头：隐状态 → 词表 logits", steps: [
    { title: "⑭ 最终 LayerNorm",
      items: [M(4, 768, "h", "act"), A("ln_f"), M(4, 768, "h̃", "act")],
      code: "h_tilde = layer_norm_f(h)",
      note: "对 12 层堆叠后的输出做一次全局 LN（ln_f.weight / bias）。" },
    { title: "⑮ lm_head（与 wte 共享权重）",
      items: [M(4, 768, "h̃", "act", { hc: 768 }), O("@"), M(768, 50257, "W_teᵀ", "param", { hr: 768 }), O("="), M(4, 50257, "logits", "out")],
      code: "logits = h_tilde @ wte.weight.T    # 无单独 lm_head.weight",
      note: "每一行是「该位置下一个 token」在未归一化分数上的分布。V=50257 很大，图中矩阵很宽只表示相对大小。weight tying：输出层与词嵌入共用 wte。" },
    { title: "⑯ 取最后一个位置 → softmax → 预测 token",
      items: [M(1, 50257, "logits[-1]", "out"), A("softmax"), M(1, 50257, "probs", "out"), A("argmax"), M(1, 1, "next_id", "out")],
      code: "next_logits = logits[0, -1, :]           # 最后一个 token 位置\nprobs = softmax(next_logits)\nnext_id = argmax(probs)   # 或 sample(multinomial)",
      note: "因果 LM：位置 t 的 logits 预测「紧跟在 input[t] 后面的 token」。整句推理时通常看最后一个位置，得到下一个词 id；再把 id 拼回输入，重复 ⑮⑯ 即自回归生成。" },
    { title: "⑰ id 解码回文本（可选）",
      items: [M(1, 1, "next_id", "out"), A("tokenizer.decode"), M(1, 6, "下一词", "out", { rl: "1" })],
      code: 'tokenizer.decode([next_id])   # 例如 " on"',
      note: "预测结果是离散 id；要给人看需走分词器逆向。训练时用交叉熵：把 logits 与「真实下一个 id」对齐，而非本页的 argmax 演示。" },
  ]},
  { title: "五、自回归生成（多步预测，概念）", steps: [
    { title: "⑱ 循环：拼 token → 再前向",
      items: [M(1, 4, "input_ids", "data"), A("前向 ②~⑯"), M(1, 1, "next_id", "out"), A("concat"), M(1, 5, "input_ids'", "data")],
      code: "for _ in range(max_new_tokens):\n    logits = model(input_ids).logits\n    next_id = sample(logits[:, -1, :])\n    input_ids = cat([input_ids, next_id], dim=1)",
      note: "每步 T 增 1，每步都把整段序列重新前向一遍：旧位置的 K、V 被反复重算，注意力分数是 (T, T)。超过 1024 需截断或换更长上下文模型。下一节的 KV cache 就是为了去掉这部分重复计算。" },
  ]},
  { title: "六、KV cache：只算新 token，复用旧的 K / V", steps: [
    { title: "⑲ Prefill：处理提示词，顺便把 K、V 存下来",
      items: [M(4, 2304, "qkv", "attn"), A("split, 分头"), M(4, 64, "K_h", "cache", { rl: "T" }), O(","), M(4, 64, "V_h", "cache", { rl: "T" }), A("存入第 ℓ 层"), M(4, 64, "K_cache_h", "cache", { rl: "T" })],
      code: "# 第一次调用：整段 prompt 正常前向（与 ⑤~⑬ 完全相同）\nout = model(input_ids, use_cache=True)\npast = out.past_key_values   # 12 层，每层 (K, V)，各 (B, H, T, dh) = (1, 12, 4, 64)",
      note: "K、V 只取决于该位置自己的 token 和之前的层，后来的 token 不会改变它们（因果 mask 保证这一点），所以算一次就可以一直复用。Q 不需要缓存：旧位置的 query 只在预测它自己的下一个 token 时用过一次。" },
    { title: "⑳ Decode：新 token 只有 1 行",
      items: [M(1, 768, "x_new", "act", { hc: 768 }), O("@"), M(768, 2304, "W_attn", "param", { hr: 768 }), O("+"), V(2304, "b_attn", "param"), O("="), M(1, 2304, "qkv_new", "attn")],
      code: "out = model(next_id, past_key_values=past, use_cache=True)   # next_id: (1, 1)\n# 嵌入: wte[next_id] + wpe[T]   注意位置下标是 T=4，而不是 0",
      note: "输入从 (T, 768) 变成 (1, 768)，所有线性层（c_attn、c_proj、c_fc、mlp.c_proj、lm_head）的计算量都缩小为原来的 1/T。位置嵌入要用新 token 的真实位置 T，否则位置信息错乱。" },
    { title: "㉑ 把新的 k、v 追加到缓存末尾",
      items: [M(4, 64, "K_cache_h", "cache", { rl: "T" }), O("∥"), M(1, 64, "k_new_h", "attn"), O("="), M(5, 64, "K_cache_h'", "cache", { rl: "T+1" })],
      code: "K = cat([past_K, k_new], dim=-2)   # (1, 12, 4, 64) ∥ (1, 12, 1, 64) → (1, 12, 5, 64)\nV = cat([past_V, v_new], dim=-2)",
      note: "沿序列维（T 维）拼接，V 同理。每生成一个 token，每层的 K、V 缓存各长 1 行；12 层都要做。" },
    { title: "㉒ 注意力分数：只有 1 行，不再是 T×T",
      items: [M(1, 64, "q_new_h", "attn", { hc: 64 }), O("@"), M(64, 5, "K_cache_h'ᵀ", "cache", { hr: 64, cl: "T+1" }), O("="), M(1, 5, "scores_h", "attn", { cl: "T+1" })],
      code: "scores = q_new @ K.transpose(-2, -1) / sqrt(dh)   # (1, 12, 1, 5)\nweights = softmax(scores, dim=-1)                 # 不需要因果 mask",
      note: "新 token 是序列最后一个位置，本来就可以看到所有 s ≤ T，因此不需要 mask。对比无缓存：⑧ 的 scores 是 (T+1, T+1)，其中前 T 行都是上一步算过的结果。" },
    { title: "㉓ 加权求和缓存的 V → 输出 1 行",
      items: [M(1, 5, "A_h", "attn", { hc: 1, cl: "T+1" }), O("@"), M(5, 64, "V_cache_h'", "cache", { hr: 1, rl: "T+1" }), O("="), M(1, 64, "head_out", "attn"), A("拼头 + c_proj"), M(1, 768, "attn_out", "act")],
      code: "ctx = weights @ V    # (1, 12, 1, 64)\nattn_out = merge_heads(ctx) @ W_proj + b_proj   # (1, 768)",
      note: "内维 T+1=5 被求和消掉。后面的残差、LN、MLP 与 ⑪~⑬ 一样，只是行数是 1。" },
    { title: "㉔ 一路到 logits：直接得到下一个 token",
      items: [M(1, 768, "h̃_new", "act", { hc: 768 }), O("@"), M(768, 50257, "W_teᵀ", "param", { hr: 768 }), O("="), M(1, 50257, "logits", "out"), A("argmax"), M(1, 1, "next_id", "out")],
      code: "next_id = argmax(out.logits[:, -1, :])\npast = out.past_key_values   # 长度变为 T+1，下一轮继续传入",
      note: "logits 只有 1 行，就是下一个 token 的分布，不用再取 [-1]（虽然取了也一样）。然后回到 ⑳，循环到生成结束。" },
    { title: "㉕ 缓存总大小：随序列长度线性增长",
      items: [V(1, "1 个 token", "data"), A("× 12 层 × (K, V)"), M(24, 768, "新增 cache", "cache", { rl: "2·L", cl: "H·dh" }), A("× T"), M(24, 768, "总 cache × T", "cache", { rl: "2·L", cl: "H·dh" })],
      code: "# 完整形状: 12 层 × 2 × (B, H, T, dh)\nper_token = 2 * n_layer * n_embd            # 2 × 12 × 768 = 18432 个数\nbytes_fp32 = per_token * 4                  # ≈ 72 KB / token\n# T = 1024 时 ≈ 72 MB（B=1, fp32）；fp16 减半",
      note: "缓存大小 = 2 × 层数 × 隐藏维 × 序列长度 × batch × 每元素字节数。GPT-2 small 不大，但大模型（几十层、几千维、长上下文、batch 很大）时 KV cache 往往比权重还占显存，所以有 MQA/GQA、分页缓存（PagedAttention）、量化缓存等优化。" },
  ]},
];

const THEORY = {
  "①": String.raw`

const theoryHtml = (st) => {
  const t = THEORY[[...st.title][0]];
  return t ? `<div class="theory"><span class="tag">原理与公式</span>${t}</div>` : "";
};

const S = (n) => (n <= 1 ? 12 : Math.round(8 * Math.sqrt(n)));
const textW = (s, px) => [...s].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? px : px * 0.6), 0);

function braceH(x0, x1, y) {
  const m = (x0 + x1) / 2, r = Math.min(5, (x1 - x0) / 4);
  return `M${x0} ${y} Q${x0} ${y - 5} ${x0 + r} ${y - 5} L${m - r} ${y - 5} Q${m} ${y - 5} ${m} ${y - 10} Q${m} ${y - 5} ${m + r} ${y - 5} L${x1 - r} ${y - 5} Q${x1} ${y - 5} ${x1} ${y}`;
}
function braceV(x, y0, y1) {
  const m = (y0 + y1) / 2, r = Math.min(5, (y1 - y0) / 4);
  return `M${x} ${y0} Q${x - 5} ${y0} ${x - 5} ${y0 + r} L${x - 5} ${m - r} Q${x - 5} ${m} ${x - 10} ${m} Q${x - 5} ${m} ${x - 5} ${m + r} L${x - 5} ${y1 - r} Q${x - 5} ${y1} ${x} ${y1}`;
}

function renderRow(items) {
  const LW = 46, PT = 40, PB = 34, GAP = 12;
  const H = Math.max(24, ...items.filter((i) => i.k === "m").map((i) => S(i.r)));
  let x = 6;
  const parts = [];
  for (const it of items) {
    if (it.k === "m") {
      const w = S(it.c), h = S(it.r);
      const showR = it.r > 1, showC = it.c > 1;
      const lw = showR ? LW : 6;
      const nameW = textW(it.name, 14);
      const bx = x + lw + Math.max(0, (nameW - w) / 2);
      const by = PT + (H - h) / 2;
      const k = KIND[it.kind];
      parts.push(`<rect x="${bx}" y="${by}" width="${w}" height="${h}" rx="2" fill="${k.fill}" stroke="${k.stroke}" stroke-width="1.8"/>`);
      if (showC) {
        const col = it.hc ? HL : "#444";
        parts.push(`<path d="${braceH(bx, bx + w, by - 4)}" fill="none" stroke="${col}" stroke-width="1.3"/>`);
        parts.push(`<text x="${bx + w / 2}" y="${by - 18}" text-anchor="middle" class="dim" fill="${col}">${it.cl ?? it.c}</text>`);
      }
      if (showR) {
        const col = it.hr ? HL : "#444";
        parts.push(`<path d="${braceV(bx - 4, by, by + h)}" fill="none" stroke="${col}" stroke-width="1.3"/>`);
        parts.push(`<text x="${bx - 17}" y="${by + h / 2 + 5}" text-anchor="end" class="dim" fill="${col}">${it.rl ?? it.r}</text>`);
      }
      parts.push(`<text x="${bx + w / 2}" y="${by + h + 20}" text-anchor="middle" class="nm">${it.name}</text>`);
      x = Math.max(bx + w, bx + w / 2 + nameW / 2) + GAP;
    } else if (it.k === "o") {
      const w = Math.max(28, textW(it.s, 18) + 14);
      parts.push(`<text x="${x + w / 2}" y="${PT + H / 2 + 7}" text-anchor="middle" class="op">${it.s}</text>`);
      x += w;
    } else {
      const w = Math.max(80, textW(it.s, 13) + 24);
      const cy = PT + H / 2;
      parts.push(`<path d="M${x + 6} ${cy - 2} H${x + w - 10} M${x + 6} ${cy + 2} H${x + w - 10} M${x + w - 18} ${cy - 7} L${x + w - 6} ${cy} L${x + w - 18} ${cy + 7}" fill="none" stroke="#333" stroke-width="1.5"/>`);
      parts.push(`<text x="${x + w / 2}" y="${cy - 10}" text-anchor="middle" class="ar">${it.s}</text>`);
      x += w + 4;
    }
  }
  const W = x + 6, Ht = PT + H + PB;
  return `<svg width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" xmlns="http://www.w3.org/2000/svg">
    <style>
      text { font-family: "Comic Sans MS","Segoe Print","Kalam",cursive,sans-serif; fill: #222; }
      .dim { font-size: 13px; } .nm { font-size: 14px; } .op { font-size: 20px; font-weight: 600; } .ar { font-size: 13px; }
      .dim[fill="${HL}"] { font-weight: 700; }
    </style>${parts.join("")}</svg>`;
}

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

document.getElementById("legend").innerHTML = Object.values(KIND)
  .map((k) => `<span><i style="border-color:${k.stroke};background:${k.fill}"></i>${k.name}</span>`).join("");

document.getElementById("content").innerHTML = SECTIONS.map((sec) => `
  <h2>${sec.title}</h2>
  ${sec.steps.map((st) => `
    <div class="card">
      <h3>${st.title}</h3>
      <div class="fig">${renderRow(st.items)}</div>
      <pre>${esc(st.code)}</pre>
      <p class="note">${esc(st.note)}</p>
      ${theoryHtml(st)}
    </div>`).join("")}
`).join("") + `
  <h2>七、有无 KV cache 对比（已有 T 个 token，生成第 T+1 个）</h2>
  <div class="card">
    <table>
      <tr><th>项目</th><th>无 cache（每步全量前向）</th><th>有 cache（Decode）</th></tr>
      <tr><td>模型输入</td><td>input_ids (1, T+1)</td><td>next_id (1, 1) + past_key_values</td></tr>
      <tr><td>每层 qkv</td><td>(T+1, 2304)</td><td>(1, 2304)</td></tr>
      <tr><td>每头 scores</td><td>(T+1, T+1)，需要因果 mask</td><td>(1, T+1)，不需要 mask</td></tr>
      <tr><td>每层 K / V</td><td>每步重算 (H, T+1, dh)</td><td>缓存 (H, T, dh) ∥ 新算 (H, 1, dh)</td></tr>
      <tr><td>MLP / lm_head 行数</td><td>T+1</td><td>1</td></tr>
      <tr><td>生成 N 个 token 的注意力总计算</td><td>≈ Σ T² （平方增长）</td><td>≈ Σ T （线性增长）</td></tr>
      <tr><td>额外显存</td><td>无</td><td>2 × 12 × 768 × T × 4 字节（fp32）</td></tr>
    </table>
    <p class="note">本质是用空间换时间：K、V 不随后续 token 改变，所以存起来；代价是缓存随序列长度线性增长。Prefill 阶段（⑲）计算密集，Decode 阶段（⑳~㉔）每步计算量小、主要瓶颈变成读取权重和缓存的内存带宽。</p>
  </div>

  <h2>八、张量形状速查（B=1, T=4, GPT-2 small）</h2>
  <div class="card">
    <table>
      <tr><th>阶段</th><th>张量</th><th>形状</th><th>主要计算</th><th>safetensors 名称（示例）</th></tr>
      <tr><td>输入</td><td>input_ids</td><td>(1, T)</td><td>BPE 查表</td><td>—</td></tr>
      <tr><td>嵌入</td><td>x⁽⁰⁾</td><td>(T, d)</td><td>wte[id] + wpe[pos]</td><td>wte.weight, wpe.weight</td></tr>
      <tr><td>注意力</td><td>qkv</td><td>(T, 3d)</td><td>x̂ @ W_attn</td><td>h.ℓ.attn.c_attn.*</td></tr>
      <tr><td>注意力</td><td>scores</td><td>(H, T, T)</td><td>Q Kᵀ / √d_h</td><td>—</td></tr>
      <tr><td>注意力</td><td>ctx</td><td>(H, T, d_h)</td><td>softmax(scores) @ V</td><td>h.ℓ.attn.c_proj.*</td></tr>
      <tr><td>MLP</td><td>m</td><td>(T, 4d)</td><td>GELU(x @ W_fc)</td><td>h.ℓ.mlp.c_fc.*</td></tr>
      <tr><td>块输出</td><td>x⁽ℓ⁾</td><td>(T, d)</td><td>残差 ×2，重复 12 层</td><td>h.0 … h.11</td></tr>
      <tr><td>输出</td><td>logits</td><td>(T, V)</td><td>h̃ @ wte.T</td><td>wte（共享）</td></tr>
      <tr><td>预测</td><td>next_id</td><td>标量</td><td>argmax(logits[-1])</td><td>—</td></tr>
    </table>
    <p class="note">记忆要点：序列维 T 在注意力里通过 T×T 分数矩阵交互；通道维 d 在线性层里作为矩阵乘的内维被消掉。与 MNIST 教程相同，<code>A @ B</code> 要求 A 的列数等于 B 的行数。</p>
  </div>`;

document.addEventListener("DOMContentLoaded", () => {
  if (!window.renderMathInElement) return;
  renderMathInElement(document.body, {
    delimiters: [{ left: "\\[", right: "\\]", display: true }, { left: "\\(", right: "\\)", display: false }],
    strict: false,
  });

</script>
